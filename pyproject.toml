[project]
name = "mahno-tv-manager"
version = "0.0.1"
description = "Autonomous virtual TV channel manager (director/scheduler for an OBS-driven playout engine)"
requires-python = ">=3.11"
dependencies = [
    "obsws-python>=1.7",
    "google-genai>=0.3",
    "playwright>=1.40",  # renders continuity-card HTML to stills; also needs `playwright install chromium`
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
